name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths: [Cargo.lock, Cargo.toml]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# hypred-greeter configuration. Every key is optional; this file documents
# the defaults. Relative [paths] entries resolve against this file's
# directory (/etc/greetd/hypred-greeter/). A broken config never blocks
# login: problems fall back to defaults and show up in an on-screen banner.

[paths]
layout = "layout.toml"     # widget tree; missing file → built-in layout
style = "style.css"        # GTK4 CSS; missing file → built-in style

[background]
# Default image for `background` widgets (they can override per-widget).
# image = "/usr/share/hypred-greeter/background.png"
fit = "cover"              # cover | contain | fill | scale-down

[gtk]
# Unset keys leave the GTK defaults alone.
# dark = true
# theme = "adw-gtk3-dark"
# icon-theme = "Papirus-Dark"
# cursor-theme = "Adwaita"
# font = "Cantarell 14"

[auth]
# Open the PAM conversation as soon as a username is known (the remembered
# user at startup, or when the username entry settles) instead of at the
# first password submit. With pam_fprintd ahead of the password modules this
# arms the fingerprint reader the moment the greeter appears. Eager
# conversations get cancelled (restarts, username changes) — carry the PAM
# stack from README "Fingerprint" before enabling, or faillock counts each
# cancel as a failed login.
eager = false
# When a conversation parked at the password prompt is restarted so the
# reader re-arms (pam_fprintd gives up after its timeout; only a fresh
# conversation arms it again): "always" — after every timed-out cycle, so a
# touch logs in whenever you walk up; N — for N seconds after the last
# input, then on the next input; 0 — never.
rearm-window = 0
# The username shown when nothing is remembered yet (a layout without a
# `username` widget needs one).
# user = "edraven"
# Text left in the password entry keeps a parked prompt ready (no re-arm)
# for this many seconds after the last input.
typing-hold = 30
# How long the username entry has to settle before an eager conversation
# opens for the name typed.
username-debounce-ms = 400

[commands]
# Any name = argv; a `button` runs one by name (action = "suspend"). reboot
# and poweroff are the power widget's, kept unless overridden here.
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]
# suspend = ["systemctl", "suspend"]

[sessions]
# Prepended to the Exec of X11 sessions (from xsessions/ dirs).
x11-prefix = ["startx", "/usr/bin/env"]
# Extra KEY=value pairs handed to greetd's start_session.
# env = ["XCURSOR_SIZE=24"]
# Preselected for a user with no session remembered yet (else the first by
# name): "<wayland|x11>/<desktop file stem>".
# default = "wayland/hyprland-uwsm"
# Same ids: `only` keeps just these, `hide` drops these, `order` lists
# these first (the rest follow by name). An id that matches nothing is
# named in the banner.
# only = ["wayland/hyprland-uwsm", "x11/plasma"]
# hide = ["wayland/hyprland"]
# order = ["wayland/hyprland-uwsm"]
# Appended to the display name of X11 sessions.
x11-suffix = " (X11)"
# Display names per id (a renamed X11 session gets no suffix).
# [sessions.names]
# "wayland/hyprland-uwsm" = "Hyprland"

[texts]
# The greeter's own messages; {program} and {error} are filled in.
enter-username = "enter a username"
username-changed = "username changed — enter the password again"
auth-failed = "authentication failed"
power-failed = "{program}: {error}"
# Rewrite rules for everything shown — PAM info and errors, prompts,
# failures: the first rule whose `match` is found in the text (a
# substring; with `regex = true` a glib::Regex pattern, `\1` references
# allowed in `text`) replaces it with `text`; "" drops the message; `kind`
# (info | error | prompt | failure) limits a rule to one kind.
# [[texts.rewrite]]
# match = "Place your"
# text = "Touch the fingerprint reader"
# kind = "info"
